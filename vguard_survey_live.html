<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V-Guard · Who Decides What You Buy?</title>
<style>
  :root{
    --navy:#10233b;--navy-2:#1b3554;--copper:#c8703a;--copper-lt:#e59b6b;
    --amber:#f2b134;--paper:#f6f3ec;--paper-card:#fffdf8;--ink:#14202e;
    --muted:#5f7189;--green:#2f9e6f;--line:rgba(16,35,59,.12);
    --shadow:0 12px 40px -12px rgba(16,35,59,.35);--r:18px;
    --display:"Space Grotesk",-apple-system,system-ui,sans-serif;
    --body:"Inter","Noto Sans",-apple-system,system-ui,sans-serif;
  }
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=Noto+Sans:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&family=Noto+Sans+Tamil:wght@400;500;600&family=Noto+Sans+Telugu:wght@400;500;600&family=Noto+Sans+Kannada:wght@400;500;600&family=Noto+Sans+Malayalam:wght@400;500;600&family=Noto+Sans+Bengali:wght@400;500;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--body);color:var(--ink);
    background:radial-gradient(1200px 600px at 80% -10%,rgba(242,177,52,.10),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(200,112,58,.10),transparent 55%),var(--paper);
    min-height:100dvh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
  .rail{position:sticky;top:0;z-index:20;background:rgba(246,243,236,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .rail-in{max-width:720px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px}
  .mark{font-family:var(--display);font-weight:700;letter-spacing:-.02em;font-size:15px;color:var(--navy);white-space:nowrap;display:flex;align-items:center;gap:8px}
  .mark .bolt{width:22px;height:22px;display:grid;place-items:center;background:var(--navy);border-radius:6px;color:var(--amber);font-size:13px}
  .track{flex:1;height:8px;background:rgba(16,35,59,.10);border-radius:99px;overflow:hidden}
  .fill{height:100%;width:0;background:linear-gradient(90deg,var(--copper),var(--amber));border-radius:99px;transition:width .5s cubic-bezier(.4,0,.1,1)}
  .langbtn{font-family:var(--body);font-size:13px;font-weight:600;color:var(--navy);background:#fff;border:1.4px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px}
  .langbtn:hover{border-color:var(--copper-lt)}
  main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:32px 20px 120px}
  .stage{width:100%;max-width:720px}
  .card{background:var(--paper-card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:38px 34px 30px;animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--copper);margin-bottom:16px}
  .eyebrow .dot{width:7px;height:7px;border-radius:99px;background:var(--amber);box-shadow:0 0 0 4px rgba(242,177,52,.2)}
  h1.q{font-family:var(--display);font-weight:600;font-size:clamp(21px,4.4vw,29px);line-height:1.25;letter-spacing:-.01em;color:var(--navy);margin-bottom:8px}
  .sub{font-size:14.5px;color:var(--muted);line-height:1.5;margin-bottom:24px;max-width:56ch}
  .hint{font-size:12.5px;color:var(--copper);font-weight:600;margin-bottom:18px}
  .opts{display:grid;gap:10px}
  .opts.two{grid-template-columns:1fr 1fr}
  @media(max-width:560px){.opts.two{grid-template-columns:1fr}}
  .opt{display:flex;align-items:center;gap:13px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:15px 16px;cursor:pointer;font:inherit;font-size:14.5px;color:var(--ink);transition:border-color .15s,transform .12s,background .15s,box-shadow .15s}
  .opt:hover{border-color:var(--copper-lt);transform:translateY(-1px)}
  .opt .tick{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;transition:.15s}
  .opt .tick svg{width:12px;height:12px;opacity:0;transform:scale(.4);transition:.15s}
  .opt.sel{border-color:var(--copper);background:linear-gradient(0deg,rgba(242,177,52,.08),rgba(242,177,52,.08)),#fff;box-shadow:0 6px 18px -8px rgba(200,112,58,.5)}
  .opt.sel .tick{background:var(--copper);border-color:var(--copper)}
  .opt.sel .tick svg{opacity:1;transform:scale(1);color:#fff}
  .opt .rank{width:22px;height:22px;border-radius:7px;background:var(--navy);color:var(--amber);font-family:var(--display);font-weight:700;font-size:12px;display:none;place-items:center;flex:none}
  .opt.sel .rank{display:grid}.opt.sel .tick{display:none}
  .opt .lead{font-size:19px;line-height:1;flex:none}
  .matrix{display:grid;gap:14px}
  .mrow{background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:14px 15px}
  .mrow.done{border-color:var(--green);background:linear-gradient(0deg,rgba(47,158,111,.05),rgba(47,158,111,.05)),#fff}
  .mrow-h{font-family:var(--display);font-weight:600;font-size:15px;color:var(--navy);margin-bottom:11px;display:flex;align-items:center;gap:9px}
  .mrow-h .em{font-size:18px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{font:inherit;font-size:12.5px;padding:8px 12px;border-radius:99px;border:1.4px solid var(--line);background:var(--paper);color:var(--muted);cursor:pointer;transition:.13s;font-weight:500}
  .chip:hover{border-color:var(--copper-lt);color:var(--ink)}
  .chip.on{background:var(--navy);border-color:var(--navy);color:var(--amber);font-weight:600}
  .field{width:100%;font:inherit;font-size:16px;padding:15px 16px;border:1.5px solid var(--line);border-radius:13px;background:#fff;color:var(--ink)}
  .field:focus{outline:none;border-color:var(--copper)}
  .nav{position:fixed;left:0;right:0;bottom:0;background:rgba(246,243,236,.9);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:20}
  .nav-in{max-width:720px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px}
  .btn{font-family:var(--display);font-weight:600;font-size:15px;border:none;border-radius:12px;padding:13px 26px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:8px}
  .btn-primary{background:var(--navy);color:#fff}
  .btn-primary:hover{background:var(--navy-2);transform:translateY(-1px);box-shadow:0 8px 20px -8px rgba(16,35,59,.6)}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
  .btn-ghost{background:transparent;color:var(--muted);padding:13px 10px}
  .btn-ghost:hover{color:var(--navy)}
  .btn-ghost:disabled{opacity:0;pointer-events:none}
  .center{text-align:center;padding:44px 34px}
  .center .big{font-family:var(--display);font-weight:700;font-size:clamp(28px,6.4vw,44px);line-height:1.08;letter-spacing:-.02em;color:var(--navy);margin:18px 0 14px}
  .center .big em{font-style:normal;color:var(--copper)}
  .center p{color:var(--muted);font-size:15.5px;line-height:1.6;max-width:48ch;margin:0 auto 10px}
  .meta{display:flex;gap:22px;justify-content:center;margin-top:26px;flex-wrap:wrap}
  .meta div{font-size:13px;color:var(--muted)}
  .meta b{display:block;font-family:var(--display);font-size:20px;color:var(--navy);font-weight:700}
  .hero-bolt{width:64px;height:64px;margin:0 auto;background:var(--navy);border-radius:18px;display:grid;place-items:center;color:var(--amber);font-size:32px;box-shadow:var(--shadow);transform:rotate(-6deg)}
  .pill{display:inline-block;background:rgba(47,158,111,.12);color:var(--green);font-weight:600;font-size:13px;padding:7px 14px;border-radius:99px;margin-bottom:8px}
  .err{color:#c0392b;font-size:13px;min-height:16px;font-weight:500;text-align:center}
  /* language grid on intro */
  .langgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;max-width:420px;margin:22px auto 0}
  @media(min-width:520px){.langgrid{grid-template-columns:repeat(4,1fr)}}
  .langcard{font:inherit;font-size:15px;font-weight:600;padding:13px 8px;border-radius:12px;border:1.6px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;transition:.14s}
  .langcard:hover{border-color:var(--copper);transform:translateY(-1px)}
  .langcard.sel{border-color:var(--copper);background:linear-gradient(0deg,rgba(242,177,52,.10),rgba(242,177,52,.10)),#fff}
  .langlabel{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:600;margin-top:20px}
  .spin{width:34px;height:34px;border:3px solid rgba(16,35,59,.15);border-top-color:var(--copper);border-radius:50%;animation:sp .8s linear infinite;margin:8px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* language sheet overlay */
  .sheet{position:fixed;inset:0;background:rgba(16,35,59,.4);backdrop-filter:blur(3px);z-index:50;display:none;align-items:flex-end;justify-content:center}
  .sheet.open{display:flex}
  .sheet-in{background:var(--paper-card);border-radius:22px 22px 0 0;padding:24px 20px 30px;width:100%;max-width:520px;animation:up .3s ease}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .sheet h3{font-family:var(--display);font-size:17px;color:var(--navy);margin-bottom:14px;text-align:center}
</style>
</head>
<body>
<div class="rail">
  <div class="rail-in">
    <div class="mark"><span class="bolt">⚡</span><span id="brandTxt">V-GUARD</span></div>
    <div class="track"><div class="fill" id="fill"></div></div>
    <button class="langbtn" id="langBtn">🌐 <span id="langCur">EN</span></button>
  </div>
</div>
<main><div class="stage" id="stage"></div></main>
<div class="nav">
  <div class="nav-in">
    <button class="btn btn-ghost" id="back"></button>
    <div class="err" id="err"></div>
    <button class="btn btn-primary" id="next"></button>
  </div>
</div>
<div class="sheet" id="sheet"><div class="sheet-in">
  <h3 id="sheetTitle">Choose your language</h3>
  <div class="langgrid" id="langGrid"></div>
</div></div>

const PRODUCTS = Object.keys(PROD).map(id=>({id, em:PROD[id].em, grp:['fan','cooler','purifier','geyser','lighting'].includes(id)?'dur':'elec'}));
const INFLUENCERS = ['self','electrician','retailer','online','builder'];

/* survey order + per-question meta */
const ORDER = [
  {id:'q1',type:'multi',sec:'secContext',min:1},
  {id:'q2',type:'multi',sec:'secContext',min:1},
  {id:'q3',type:'single',sec:'secContext'},
  {id:'q4',type:'matrix',sec:'secBig'},
  {id:'q5',type:'single',sec:'secTrust'},
  {id:'q6',type:'multi',sec:'secTrust',min:1,max:2},
  {id:'q7',type:'rank',sec:'secValue',pick:3},
  {id:'q8',type:'rank',sec:'secValue',pick:3},
  {id:'q9',type:'single',sec:'secBrand'},
  {id:'q10',type:'text',sec:'secBrand',optional:true},
  {id:'q11',type:'single',sec:'secRoad'},
  {id:'q12',type:'single',sec:'secRoad'},
  {id:'q13',type:'single',sec:'secYou'},
  {id:'q14',type:'single',sec:'secYou'},
  {id:'q15',type:'single',sec:'secYou'},
];
const TOTAL = ORDER.length;

let lang = 'en';
let idx = -1; // -1 = intro, TOTAL = outro
const answers = {};
const startedAt = Date.now();

const $ = s=>document.querySelector(s);
const stage=$('#stage'),fill=$('#fill'),nextBtn=$('#next'),backBtn=$('#back'),errEl=$('#err');
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"><path d="M5 13l4 4L19 7"/></svg>';
const t = k => (I18N[lang]&&I18N[lang][k])||I18N.en[k];

function setLangUI(){
  document.documentElement.lang=lang;
  document.body.dir=I18N[lang].dir||'ltr';
  $('#langCur').textContent = lang.toUpperCase();
  backBtn.textContent = t('back');
}

/* option label helpers pull from TX/PROD/INF by value-id */
function optLabel(qid,vid){
  const q=TX[qid];
  if(q.labels&&q.labels[vid]) return q.labels[vid][lang]||q.labels[vid].en;
  return vid;
}
function prodLabel(id){return PROD[id][lang]||PROD[id].en;}
function infLabel(id){return INF[id][lang]||INF[id].en;}
function qText(qid,f){const q=TX[qid];return (q[lang]&&q[lang][f])||(q.en&&q.en[f])||'';}

function activeProducts(){const p=answers.q1||[];return PRODUCTS.filter(x=>p.includes(x.id));}

function render(){
  errEl.textContent='';
  const pct = idx<0?0:idx>=TOTAL?100:Math.round((idx/TOTAL)*100);
  fill.style.width=pct+'%';
  backBtn.disabled = idx<=-1;
  nextBtn.style.visibility = idx>=TOTAL?'hidden':'visible';
  if(idx<0) return renderIntro();
  if(idx>=TOTAL) return renderOutro();
  nextBtn.textContent = idx===TOTAL-1?t('finish'):t('continue');

  const item=ORDER[idx], qid=item.id;
  let h=`<div class="card"><div class="eyebrow"><span class="dot"></span>${t(item.sec)}</div>`;
  h+=`<h1 class="q">${qText(qid,'q')}</h1>`;
  const sub=qText(qid,'sub'); if(sub)h+=`<p class="sub">${sub}</p>`;
  const hint=qText(qid,'hint'); if(hint)h+=`<div class="hint">↳ ${hint}</div>`;

  if(item.type==='single'||item.type==='multi'){
    const opts = TX[qid].opts; // object valueId->emoji  OR  (q1) array of product ids
    let list;
    if(qid==='q1') list = TX.q1.opts.map(pid=>({id:pid,label:prodLabel(pid),lead:PROD[pid].em}));
    else list = Object.keys(opts).map(vid=>({id:vid,label:optLabel(qid,vid),lead:opts[vid]}));
    const two = list.length>=5 && list.every(o=>(o.label||'').length<30);
    h+=`<div class="opts${two?' two':''}">`;
    list.forEach(o=>{
      const sel=item.type==='single'?answers[qid]===o.id:(answers[qid]||[]).includes(o.id);
      h+=`<button class="opt${sel?' sel':''}" data-id="${o.id}"><span class="tick">${CHECK}</span>${o.lead?`<span class="lead">${o.lead}</span>`:''}<span>${o.label}</span></button>`;
    });
    h+=`</div>`;
  }
  else if(item.type==='rank'){
    const cur=answers[qid]||[], opts=TX[qid].opts;
    h+=`<div class="opts">`;
    Object.keys(opts).forEach(vid=>{
      const r=cur.indexOf(vid),sel=r>-1;
      h+=`<button class="opt${sel?' sel':''}" data-id="${vid}"><span class="tick">${CHECK}</span><span class="rank">${sel?r+1:''}</span><span class="lead">${opts[vid]}</span><span>${optLabel(qid,vid)}</span></button>`;
    });
    h+=`</div>`;
  }
  else if(item.type==='matrix'){
    const rows=activeProducts();
    if(!rows.length) h+=`<p class="sub">—</p>`;
    h+=`<div class="matrix">`;
    rows.forEach(p=>{
      const val=(answers.q4||{})[p.id];
      h+=`<div class="mrow${val?' done':''}"><div class="mrow-h"><span class="em">${PROD[p.id].em}</span>${prodLabel(p.id)}</div><div class="chips">`;
      INFLUENCERS.forEach(i=>h+=`<button class="chip${val===i?' on':''}" data-row="${p.id}" data-inf="${i}">${infLabel(i)}</button>`);
      h+=`<button class="chip${val==='forget'?' on':''}" data-row="${p.id}" data-inf="forget">${infLabel('forget')}</button>`;
      h+=`</div></div>`;
    });
    h+=`</div>`;
  }
  else if(item.type==='text'){
    h+=`<input class="field" id="txt" placeholder="${t('ph10')}" value="${answers[qid]||''}" maxlength="120">`;
    h+=`<p class="sub" style="margin-top:12px;margin-bottom:0">${t('optionalSkip')}</p>`;
  }
  h+=`</div>`;
  stage.innerHTML=h;
  wire(item);
}

function wire(item){
  const qid=item.id;
  if(item.type==='single'){
    stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{answers[qid]=b.dataset.id;render();setTimeout(()=>{if(canAdvance(item))go(1);},170);});
  }
  if(item.type==='multi'){
    stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const a=answers[qid]||[];const i=a.indexOf(b.dataset.id);
      if(i>-1)a.splice(i,1);else{if(item.max&&a.length>=item.max)a.shift();a.push(b.dataset.id);}
      answers[qid]=a;render();
    });
  }
  if(item.type==='rank'){
    stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const a=answers[qid]||[];const i=a.indexOf(b.dataset.id);
      if(i>-1)a.splice(i,1);else if(a.length<item.pick)a.push(b.dataset.id);
      answers[qid]=a;render();
    });
  }
  if(item.type==='matrix'){
    stage.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{answers.q4=answers.q4||{};answers.q4[c.dataset.row]=c.dataset.inf;render();});
  }
  if(item.type==='text'){const el=$('#txt');el.oninput=()=>answers[qid]=el.value;}
}

function canAdvance(item){
  const qid=item.id;
  if(item.type==='text')return true;
  if(item.type==='single')return !!answers[qid];
  if(item.type==='multi')return (answers[qid]||[]).length>=(item.min||1);
  if(item.type==='rank')return (answers[qid]||[]).length===item.pick;
  if(item.type==='matrix'){const r=activeProducts();return !r.length||r.every(p=>(answers.q4||{})[p.id]);}
  return true;
}
function go(d){idx=Math.max(-1,Math.min(TOTAL,idx+d));window.scrollTo({top:0,behavior:'smooth'});render();}

nextBtn.onclick=()=>{
  if(idx<0){go(1);return;}
  const item=ORDER[idx];
  if(!canAdvance(item)){
    const m={multi:`${t('errMulti')} ${item.min||1}.`,single:t('errOne'),rank:`${t('errRank')} ${item.pick}.`,matrix:t('errMatrix')};
    errEl.textContent=m[item.type]||t('errOne');return;
  }
  if(idx===TOTAL-1){go(1);submit();return;}
  go(1);
};
backBtn.onclick=()=>go(-1);
document.addEventListener('keydown',e=>{
  if(idx<0||idx>=TOTAL)return;
  const item=ORDER[idx];
  if(e.key==='Enter'){nextBtn.click();return;}
  if(/^[1-9]$/.test(e.key)&&(item.type==='single'||item.type==='multi'||item.type==='rank')){
    const b=stage.querySelectorAll('.opt')[+e.key-1];if(b)b.click();
  }
});

/* ---------- intro ---------- */
function renderIntro(){
  setLangUI();nextBtn.textContent=t('begin');
  stage.innerHTML=`<div class="card center">
    <div class="hero-bolt">⚡</div>
    <div class="big">${t('heroA')} <em>${t('heroEm')}</em><br>${t('heroB')}</div>
    <p>${t('heroP1')}</p>
    <p>${t('heroP2a')} <b>${t('mMin')} ${t('m2')}</b> ${t('heroP2b')}</p>
    <div class="meta"><div><b>${TOTAL}</b>${t('m1')}</div><div><b>${t('mMin')}</b>${t('m2')}</div><div><b>100%</b>${t('m3')}</div></div>
    <div class="langlabel">${t('langPick')}</div>
    <div class="langgrid" id="introLang"></div>
  </div>`;
  const g=$('#introLang');
  Object.keys(I18N).forEach(code=>{
    const b=document.createElement('button');
    b.className='langcard'+(code===lang?' sel':'');
    b.textContent=I18N[code].name;
    b.onclick=()=>{lang=code;render();};
    g.appendChild(b);
  });
}

/* ---------- outro + submit ---------- */
function renderOutro(){
  fill.style.width='100%';setLangUI();
  stage.innerHTML=`<div class="card center">
    <div class="spin" id="spin"></div>
    <div class="big" style="font-size:clamp(24px,5vw,34px)">${t('outroA')} <em>${t('outroB')}</em></div>
    <p id="outMsg">${t('saving')}</p>
    <div id="outAction"></div>
  </div>`;
}
function buildPayload(){
  const row={
    timestamp:new Date().toISOString(),
    lang, seconds:Math.round((Date.now()-startedAt)/1000),
    q1:(answers.q1||[]).join('|'),
    q2:(answers.q2||[]).join('|'),
    q3:answers.q3||'',
    q5:answers.q5||'',
    q6:(answers.q6||[]).join('|'),
    q7:(answers.q7||[]).join('>'),
    q8:(answers.q8||[]).join('>'),
    q9:answers.q9||'',
    q10:answers.q10||'',
    q11:answers.q11||'',
    q12:answers.q12||'',
    q13:answers.q13||'',
    q14:answers.q14||'',
    q15:answers.q15||'',
  };
  PRODUCTS.forEach(p=>row['q4_'+p.id]=(answers.q4||{})[p.id]||'');
  return row;
}
function submit(){
  const payload=buildPayload();
  const done=(ok,msg)=>{
    const sp=$('#spin');if(sp)sp.style.display='none';
    const m=$('#outMsg'),a=$('#outAction');if(!m)return;
    if(ok){m.innerHTML=`<span class="pill">${t('outroPill')}</span><br>${t('outroP')}`;}
    else{m.textContent=t('saveErr');
      a.innerHTML=`<button class="btn btn-primary" id="retry">${t('retry')}</button>`;
      $('#retry').onclick=()=>{a.innerHTML='';if($('#spin'))$('#spin').style.display='';m.textContent=t('saving');submit();};
    }
  };
  if(!ENDPOINT_URL||ENDPOINT_URL.indexOf('PASTE_YOUR')===0){
    // no backend wired yet — offer local CSV so no data is lost during testing
    const sp=$('#spin');if(sp)sp.style.display='none';
    const m=$('#outMsg'),a=$('#outAction');
    m.innerHTML=`<span class="pill">${t('outroPill')}</span><br>${t('outroP')}`;
    const keys=Object.keys(payload);
    const csv=keys.join(',')+'\n'+keys.map(k=>`"${String(payload[k]).replace(/"/g,'""')}"`).join(',');
    a.innerHTML=`<button class="btn btn-primary" id="dl">⬇ Save response (.csv)</button>`;
    $('#dl').onclick=()=>{const b=new Blob([csv],{type:'text/csv'});const u=document.createElement('a');u.href=URL.createObjectURL(b);u.download='vguard_response_'+Date.now()+'.csv';u.click();$('#dl').textContent=t('saved');};
    return;
  }
  // POST to Apps Script. Use no-cors form-encoded to avoid preflight issues.
  const body=new URLSearchParams();
  Object.keys(payload).forEach(k=>body.append(k,payload[k]));
  fetch(ENDPOINT_URL,{method:'POST',body})
    .then(()=>done(true))
    .catch(()=>done(false));
  // no-cors fetches resolve opaque; give it a beat then assume ok
  setTimeout(()=>{if($('#spin')&&$('#spin').style.display!=='none')done(true);},2500);
}

/* ---------- language sheet (mid-survey switch) ---------- */
$('#langBtn').onclick=()=>{
  const sh=$('#sheet');sh.classList.add('open');
  $('#sheetTitle').textContent=t('langPick');
  const g=$('#langGrid');g.innerHTML='';
  Object.keys(I18N).forEach(code=>{
    const b=document.createElement('button');
    b.className='langcard'+(code===lang?' sel':'');
    b.textContent=I18N[code].name;
    b.onclick=()=>{lang=code;sh.classList.remove('open');render();};
    g.appendChild(b);
  });
};
$('#sheet').onclick=e=>{if(e.target.id==='sheet')e.currentTarget.classList.remove('open');};

setLangUI();render();
</script>
